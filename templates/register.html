<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - LokDrishti</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50:  '#eef4ff',
                            100: '#dbe6fe',
                            200: '#bcd0fd',
                            300: '#8fb0fb',
                            400: '#5c88f6',
                            500: '#3563ec',
                            600: '#2247d9',
                            700: '#1c38b0',
                            800: '#182f8b',
                            900: '#172a6e',
                            950: '#0f1a45',
                        },
                    },
                },
            },
        };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        html { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }
    </style>
</head>

<body class="min-h-screen bg-slate-50 dark:bg-slate-950 flex items-center justify-center px-4 py-10">

    <div class="w-full max-w-sm">

        <!-- Brand mark -->
        <div class="flex flex-col items-center mb-6">
            <img
                src="{{ url_for('static', filename='images/logo-icon.png') }}"
                alt="LokDrishti logo"
                class="h-16 w-16 object-contain mb-3"
            >
            <h1 class="text-xl font-extrabold text-slate-800 dark:text-slate-100 tracking-tight">LokDrishti</h1>
            <p class="text-[11px] font-semibold tracking-[0.2em] uppercase text-brand-600 dark:text-brand-400 mt-1">
                Report &middot; Monitor &middot; Resolve
            </p>
            <p class="text-sm text-slate-500 dark:text-slate-400 mt-2">Create your account</p>
        </div>

        <div class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 shadow-sm p-6 sm:p-7">

            {% if error %}
                <div class="flex items-start gap-2 rounded-lg border border-rose-200 dark:border-rose-900/60 bg-rose-50 dark:bg-rose-950/40 text-rose-700 dark:text-rose-300 text-sm px-3.5 py-3 mb-5">
                    <svg class="h-4.5 w-4.5 mt-0.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" />
                    </svg>
                    <span>{{ error }}</span>
                </div>
            {% endif %}

            <form method="POST" class="space-y-4">

                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Username</label>
                    <input
                        type="text"
                        name="username"
                        placeholder="Choose a username"
                        required
                        class="w-full rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-colors"
                    >
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Password</label>
                    <input
                        type="password"
                        name="password"
                        placeholder="Choose a password"
                        required
                        class="w-full rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-colors"
                    >
                </div>

                <button
                    type="submit"
                    class="w-full rounded-lg bg-brand-700 hover:bg-brand-800 text-white font-semibold text-sm py-2.5 shadow-sm transition-colors"
                >
                    Register
                </button>

            </form>

            <p class="text-center text-sm text-slate-500 dark:text-slate-400 mt-5">
                Already registered?
                <a href="{{ url_for('login') }}" class="text-brand-600 dark:text-brand-400 font-semibold hover:underline">Login</a>
            </p>

        </div>
    </div>

</body>
</html>
