<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LokDrishti</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50:  '#eef4ff',
                            100: '#dbe6fe',
                            200: '#bcd0fd',
                            300: '#8fb0fb',
                            400: '#5c88f6',
                            500: '#3563ec',
                            600: '#2247d9',
                            700: '#1c38b0',
                            800: '#182f8b',
                            900: '#172a6e',
                            950: '#0f1a45',
                        },
                    },
                },
            },
        };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        html { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }

        /* Hide Edge/Chrome's built-in password reveal icon so only our
           custom eye button shows — avoids two overlapping icons on PC. */
        input[type="password"]::-ms-reveal,
        input[type="password"]::-ms-clear {
            display: none;
        }
    </style>
</head>

<body class="min-h-screen bg-slate-50 dark:bg-slate-950 flex items-center justify-center px-4 py-10">

    <div class="w-full max-w-sm">

        <!-- Brand mark -->
        <div class="flex flex-col items-center mb-6">
            <img
                src="{{ url_for('static', filename='images/logo-icon.png') }}"
                alt="LokDrishti logo"
                class="h-16 w-16 object-contain mb-3"
            >
            <h1 class="text-xl font-extrabold text-slate-800 dark:text-slate-100 tracking-tight">LokDrishti</h1>
            <p class="text-[11px] font-semibold tracking-[0.2em] uppercase text-brand-600 dark:text-brand-400 mt-1">
                Report &middot; Monitor &middot; Resolve
            </p>
            <p class="text-sm text-slate-500 dark:text-slate-400 mt-2">Sign in to continue</p>
        </div>

        <div class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 shadow-sm p-6 sm:p-7">

            <form method="POST" class="space-y-4">

                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Username</label>
                    <input
                        type="text"
                        name="username"
                        placeholder="Enter username"
                        required
                        class="w-full rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-colors"
                    >
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Password</label>
                    <div class="relative">
                        <input
                            type="password"
                            name="password"
                            id="password"
                            placeholder="Enter password"
                            required
                            class="w-full rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 px-3.5 py-2.5 pr-10 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-colors"
                        >
                        <button
                            type="button"
                            onclick="const p=document.getElementById('password'); const eyeOpen=document.getElementById('eyeOpen'); const eyeClosed=document.getElementById('eyeClosed'); p.type = p.type === 'password' ? 'text' : 'password'; eyeOpen.classList.toggle('hidden'); eyeClosed.classList.toggle('hidden');"
                            class="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-500 dark:text-slate-400 p-1"
                            tabindex="-1"
                            aria-label="Show or hide password"
                        >
                            <svg id="eyeOpen" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            </svg>
                            <svg id="eyeClosed" class="hidden h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
                            </svg>
                        </button>
                    </div>
                    {% if error %}
                        <p class="mt-1.5 text-sm text-rose-600 dark:text-rose-400">{{ error }}</p>
                    {% endif %}
                </div>

                <button
                    type="submit"
                    class="w-full rounded-lg bg-brand-700 hover:bg-brand-800 text-white font-semibold text-sm py-2.5 shadow-sm transition-colors"
                >
                    Login
                </button>

            </form>

            <p class="text-center text-sm text-slate-500 dark:text-slate-400 mt-5">
                New user?
                <a href="{{ url_for('register') }}" class="text-brand-600 dark:text-brand-400 font-semibold hover:underline">Create an account</a>
            </p>

        </div>
    </div>

</body>
</html>
